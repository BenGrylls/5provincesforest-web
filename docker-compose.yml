services:
  postgres-db:
    image: postgres:15-alpine
    container_name: 5provinces-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password@123
      POSTGRES_DB: forest_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
